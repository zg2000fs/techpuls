<script>
const q = document.getElementById('q'), cards = [...document.querySelectorAll('#list .card')], empty = document.getElementById('empty');
q && q.addEventListener('input', () => {
  const words = q.value.toLowerCase().trim().split(/\s+/).filter(Boolean);
  let shown = 0;
  for (const c of cards) { const ok = words.every(w => c.dataset.text.includes(w)); c.hidden = !ok; shown += ok; }
  if (empty) empty.hidden = shown > 0;
});
</script>
